spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: feni
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SENDER_ADDRESS:test@example.com}
    password: ${GMAIL_APP_PASSWORD:testpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://hotel-hub.local" # placeholder
          
cloud:
  sync:
    url: ${CLOUD_SYNC_URL:http://host.docker.internal:3001/api/sync/events}
    api-key: ${CLOUD_SYNC_API_KEY:default-dev-key}
    polling-delay: 5000

jwt:
  signing-key: ${JWT_SIGNING_KEY:ixIqWy3sfa/0eGpABwxplhQ8HrCyUMBAnbpNzXt5Z1k=}

# application.yml (dev/local default)
springdoc:
  swagger-ui:
    enabled: true

bootstrap:
  facility:
    name: ${FACILITY_NAME:Feni Hotel}
    timezone: ${FACILITY_TIMEZONE:UTC}
  admin:
    username: ${ADMIN_USERNAME:admin}
    # no default password — to avoid accidentally shipping to production

storage:
  local:
    path: ./uploads
