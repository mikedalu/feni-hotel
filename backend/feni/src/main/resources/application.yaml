spring:
  application:
    name: feni
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SENDER_ADDRESS:test@example.com}
    password: ${GMAIL_APP_PASSWORD:testpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://hotel-hub.local" # placeholder
          
cloud:
  sync:
    url: "http://localhost:3001/api/sync/events"
    api-key: "default-dev-key"
    polling-delay: 5000

jwt:
  signing-key: ${JWT_SIGNING_KEY:ixIqWy3sfa/0eGpABwxplhQ8HrCyUMBAnbpNzXt5Z1k=}

# application.yml (dev/local default)
springdoc:
  swagger-ui:
    enabled: true

bootstrap:
  facility:
    name: ${FACILITY_NAME:Feni Hotel}
    timezone: ${FACILITY_TIMEZONE:UTC}
  admin:
    username: ${ADMIN_USERNAME:admin}
    # no default password — to avoid accidentally shipping to production

r2:
  bucket: ${R2_BUCKET:feni-dev}
  access-key: ${R2_ACCESS_KEY:dev}
  secret-key: ${R2_SECRET_KEY:dev}
  endpoint: ${R2_ENDPOINT:https://xxxxxx.r2.cloudflarestorage.com}
  public-url: ${R2_PUBLIC_URL:https://dev.r2.dev}
