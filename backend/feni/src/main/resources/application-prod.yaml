spring:
  application:
    name: feni-prod
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SENDER_ADDRESS}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  signing-key: ${JWT_SIGNING_KEY}

# application-prod.yml
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

storage:
  local:
    path: ${STORAGE_LOCAL_PATH:./uploads}

cloud:
  sync:
    url: ${CLOUD_SYNC_URL}
    api-key: ${CLOUD_SYNC_API_KEY}
    polling-delay: 5000