spring:
  application:
    name: feni-prod
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SENDER_ADDRESS}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  signing-key: ${JWT_SIGNING_KEY}

# application-prod.yml
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

r2:
  bucket: ${R2_BUCKET}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  endpoint: ${R2_ENDPOINT}
  public-url: ${R2_PUBLIC_URL}