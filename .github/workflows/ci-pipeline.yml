name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend (with Testcontainers)
        working-directory: ./backend/feni
        run: mvn clean verify

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './local-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./local-frontend
        run: npm ci

      - name: Run lint
        working-directory: ./local-frontend
        run: npm run lint

      # Uncomment once frontend tests are added
      # - name: Run tests
      #   working-directory: ./local-frontend
      #   run: npm test
