server {
    listen 80;
    server_name hotel-hub.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hotel-hub.local;

    ssl_certificate /home/agent-mike/Documents/feni-hotel/certs/hotel-hub.local.crt;
    ssl_certificate_key /home/agent-mike/Documents/feni-hotel/certs/hotel-hub.local.key;

    location = /hotel-hub.local.crt {
        alias /home/agent-mike/Documents/feni-hotel/certs/hotel-hub.local.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
