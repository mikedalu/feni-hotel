version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: feni-postgres
    environment:
      POSTGRES_DB: feni_hotel
      POSTGRES_USER: feni_user
      POSTGRES_PASSWORD: feni_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: feni-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend/feni
    container_name: feni-backend
    env_file: 
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/feni_hotel
      - SPRING_DATASOURCE_USERNAME=feni_user
      - SPRING_DATASOURCE_PASSWORD=feni_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - feni_uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./local-frontend
      args:
        NEXT_PUBLIC_CLOUD_URL: ${CLOUD_FRONTEND_URL:-http://localhost:3001}
    container_name: feni-frontend
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  feni_uploads:
